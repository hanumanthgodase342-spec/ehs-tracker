<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>EHS Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box}
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#111827; --muted:#6B7280; --line:#E5E7EB; --field:#D1D5DB;
  --brand:#1D4ED8; --brand-soft:#DBEAFE; --navy:#0F172A; --navy-2:#1E293B;
  --ok:#047857; --ok-bg:#D1FAE5; --warn:#B45309; --warn-bg:#FEF3C7; --bad:#B91C1C; --bad-bg:#FEE2E2;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);color-scheme:light;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}

/* layout */
.layout{min-height:100vh;display:grid;grid-template-columns:1fr}
.side{display:none}
.content{min-width:0;padding:16px 14px 110px}
.bottom{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
.bottom a.on{color:var(--brand)}
.bottom a.on::before{content:"";width:26px;height:3px;border-radius:3px;background:var(--brand);margin-bottom:4px}
@media (min-width:960px){
  .layout{grid-template-columns:240px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;background:var(--navy);color:#CBD5E1;padding:22px 14px;position:sticky;top:0;height:100vh}
  .bottom{display:none}
  .content{padding:28px 36px 48px}
}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:16px;padding:6px 10px 18px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font-weight:800}
.side a{display:flex;align-items:center;padding:10px 12px;border-radius:10px;color:#CBD5E1;text-decoration:none;font-weight:600}
.side a:hover{background:var(--navy-2);color:#fff}
.side a.on{background:var(--brand);color:#fff}
.side .who{margin-top:auto;border-top:1px solid #334155;padding:14px 10px 0}
.side .who b{display:block;color:#fff}
.side .who span{font-size:12px;color:#94A3B8}
.side .who button{margin-top:12px;width:100%;background:transparent;border:1px solid #334155;color:#CBD5E1;border-radius:10px;padding:8px;cursor:pointer}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools select{min-width:170px}
.mobile-out{display:none}
@media (max-width:959px){.mobile-out{display:inline-flex}}

/* surfaces */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0}
.stack{display:grid;gap:16px;min-width:0}
.grid{display:grid;gap:16px;min-width:0;grid-template-columns:1fr}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:960px){
  .grid.two{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .fgrid .full{grid-column:1/-1}
}
.kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
.kpi.warn::before{background:#F59E0B}
.kpi.bad::before{background:var(--bad)}
.kpi .label{font-size:13px;color:var(--muted);font-weight:600}
.kpi .val{font-size:28px;font-weight:750;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .hint{font-size:12px;color:var(--muted);margin-top:2px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-head .muted{font-size:13px}

/* buttons, chips, segmented */
.btn{background:#fff;border:1px solid var(--field);border-radius:10px;padding:10px 14px;font-weight:600;color:var(--ink);min-height:42px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:#F9FAFB}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1E40AF}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.chip{border:1px solid var(--field);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:inline-flex;background:#EEF2F7;border-radius:11px;padding:4px;gap:4px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:8px 13px;border-radius:8px;font-weight:600;color:var(--muted);min-height:36px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.search{position:relative}
.search input{width:100%;padding-left:14px}

/* pills */
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:#EEF2F7;color:#334155}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--brand-soft);color:#1E40AF}

/* lists */
.list{display:grid}
.li{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0;padding-top:4px}
.li>div:first-child{min-width:0;overflow-wrap:anywhere;flex:1}
.li .meta{font-size:13px;color:var(--muted);margin-top:3px}
.li.over{box-shadow:inset 3px 0 0 var(--bad);padding-left:12px;border-radius:4px}
.right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.empty{text-align:center;color:var(--muted);padding:28px 8px}

/* bars */
.bars{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:44px;background:var(--brand);border-radius:8px 8px 4px 4px;min-height:4px}
.bar b{font-size:12px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.bar small{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap}

/* forms */
label{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:14px;min-width:0}
label.check{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:500}
input,select,textarea{border:1px solid var(--field);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);width:100%;min-width:0;font-weight:400}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--brand)}
input:focus,select:focus,textarea:focus{outline:3px solid #BFD3FF;outline-offset:0;border-color:var(--brand)}
input[type=search]{padding-left:14px}
fieldset{border:1px dashed var(--field);border-radius:12px;padding:14px;margin:0 0 14px}
legend{font-size:13px;color:var(--muted);font-weight:600;padding:0 6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* checklist items */
.qi{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:#fff}
.qi.crit{border-left:4px solid var(--bad)}
.qi .qt{font-weight:600}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 label{display:block;margin:0;position:relative}
.seg3 input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.seg3 span{display:block;text-align:center;border:1px solid var(--field);border-radius:10px;padding:10px 6px;font-weight:700;color:var(--muted);cursor:pointer;background:#fff}
.seg3 input:checked+span{color:#fff;border-color:transparent}
.seg3 label:nth-child(1) input:checked+span{background:var(--ok)}
.seg3 label:nth-child(2) input:checked+span{background:var(--bad)}
.seg3 label:nth-child(3) input:checked+span{background:#64748B}
.seg3 input:focus-visible+span{outline:3px solid #BFD3FF}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,var(--navy) 0 38%,var(--bg) 38%)}
.login{width:100%;max-width:400px;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(15,23,42,.15);padding:26px}
.login .brand-lg{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin-bottom:6px}
.login .brand-lg .logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center}

.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,160%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;opacity:0;transition:transform .25s,opacity .25s;max-width:92%;font-size:14px;z-index:30;box-shadow:0 8px 24px rgba(15,23,42,.25)}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.ok{background:var(--ok)}
.toast.bad{background:var(--bad)}
@media (min-width:960px){.toast{bottom:28px}}
.err{color:var(--bad)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
:focus-visible{outline:3px solid #BFD3FF;outline-offset:2px}
</style>
</head>
<body>
<div id="root"><div class="empty">Loading…</div></div>

<script>
/* ============ CONFIG: paste your Supabase values here (see setup guide) ============ */
const CONFIG = {
  url: "https://caygfknyxprkycyzbnhi.supabase.co",
  key: "sb_publishable_s2s8S_cALkToUQdWBtCKyg_L9JOvMpp"
};

const { createClient } = supabase;
const sb = CONFIG.url.startsWith("PASTE") ? null : createClient(CONFIG.url, CONFIG.key);

/* ============ CONSTANTS ============ */
const EVENT_TYPES = [["incident","Incident"],["near_miss","Near miss"],["unsafe_condition","Unsafe condition"]];
const EVENT_CLS = {incident:"bad", near_miss:"warn", unsafe_condition:"info"};
const CLASSES = ["First aid","Medical treatment","Restricted work","Lost time","Fatality","Property damage","Environmental release"];
const RECORDABLE = ["Medical treatment","Restricted work","Lost time","Fatality"];
const ROOT = ["","People","Equipment","Procedure","Environment","Management"];
const COMPETENCIES = ["Working at height","Confined space entry","Permit issuer / receiver","Fire marshal","First aid","Crane / rigging signalman","Forklift operator","Electrical isolation (LOTO)","Hazardous chemical handling","Incident investigation"];
const DOC_CATS = ["HSE plan","Procedure","Method statement","Risk assessment","Permit form","Checklist","Legal / licence","Training material","Other"];
const DOC_STATUS = ["Draft","In review","Approved","Obsolete"];
const ROLE_NAMES = {admin:"HSE head", hse_officer:"HSE officer", viewer:"Viewer (read only)", contractor:"Contractor"};
const NAV = [
  ["dashboard","Dashboard","Overview of safety performance"],
  ["report","Report","Log events, manhours and training"],
  ["inspect","Inspections","Checklists for every area"],
  ["actions","Actions","Corrective actions and owners"],
  ["documents","Documents","Controlled documents and acknowledgements"]
];

/* ============ STATE ============ */
const root = document.getElementById("root");
let me = null, sitesList = [], templatesList = [];
let siteFilter = "";            // "" = all sites
let view = "dashboard";
let reportKind = "event";
let inspectCat = "All", inspectQ = "", activeTpl = null;
let actFilter = "open";
let docUploadOpen = false;
let ackSet = new Set();

/* ============ HELPERS ============ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const todayStr = () => ymd(new Date());
const plusDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const monthStart = (o = 0) => { const d = new Date(); return ymd(new Date(d.getFullYear(), d.getMonth() + o, 1)); };
const monthLabel = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { month: "short" });
const daysUntil = (s) => Math.round((new Date(s + "T00:00:00") - new Date(todayStr() + "T00:00:00")) / 864e5);
const nowLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const fx = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : Number(v).toFixed(d);
const siteName = (id) => (sitesList.find(s => s.id === id) || {}).name || "—";
const isAdmin = () => me && me.role === "admin";
const canWrite = () => me && (me.role === "admin" || me.role === "hse_officer");
const initials = (n) => (n || "?").split(/\s+/).map(p => p[0]).join("").slice(0, 2).toUpperCase();

function toast(msg, ok = true) {
  const t = $("#toast");
  if (!t) return;
  t.textContent = msg;
  t.className = "toast show " + (ok ? "ok" : "bad");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.className = "toast"; }, 3800);
}

function visibleNav() {
  const r = me.role;
  if (r === "contractor") return NAV.filter(([k]) => k === "documents");
  if (r === "viewer") return NAV.filter(([k]) => ["dashboard","actions","documents"].includes(k));
  return NAV;
}

function siteOptions(selected = "") {
  const list = me.role === "hse_officer" ? sitesList.filter(s => s.id === me.site_id) : sitesList;
  return list.map(s => `<option value="${s.id}" ${s.id === selected ? "selected" : ""}>${esc(s.name)}</option>`).join("");
}

function siteField() {
  if (me.role === "hse_officer") {
    return `<input type="hidden" name="site_id" value="${me.site_id || ""}">`;
  }
  return `<label>Site<select name="site_id" required><option value="">Choose site</option>${siteOptions(siteFilter)}</select></label>`;
}

/* ============ BOOT AND LOGIN ============ */
function boot() {
  if (!sb) {
    root.innerHTML = `<div class="login-wrap"><div class="login"><h2>Setup needed</h2>
      <p class="muted">Paste your Supabase Project URL and anon key into the CONFIG section of index.html. The setup guide shows where to find them.</p></div></div>`;
    return;
  }
  sb.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") renderLogin();
    if (event === "SIGNED_IN") loadApp();
  });
  sb.auth.getSession().then(({ data }) => (data.session ? loadApp() : renderLogin()));
}

function renderLogin(msg = "") {
  root.innerHTML = `<div class="login-wrap"><form id="loginForm" class="login">
    <div class="brand-lg"><span class="logo">E</span> EHS Management</div>
    <p class="muted small" style="margin:0 0 18px">Sign in with the email and password your HSE head gave you.</p>
    <label>Email<input type="email" name="email" required autocomplete="username"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn primary block" type="submit">Sign in</button>
    <p class="err small" role="alert" style="margin:12px 0 0">${esc(msg)}</p>
  </form></div>`;
  $("#loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target;
    const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
    if (error) renderLogin("Sign-in failed. Check your email and password.");
  };
}

async function loadApp() {
  const { data: { user } } = await sb.auth.getUser();
  const { data: prof } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if (!prof) {
    root.innerHTML = `<div class="login-wrap"><div class="login"><h2>Account not set up</h2>
      <p class="muted">Ask your HSE head to give your account a role.</p>
      <button id="signout" class="btn block">Sign out</button></div></div>`;
    $("#signout").onclick = () => sb.auth.signOut();
    return;
  }
  me = prof;
  if (me.role === "hse_officer") siteFilter = me.site_id || "";
  const [s, t] = await Promise.all([
    sb.from("sites").select("*").order("name"),
    sb.from("checklist_templates").select("*").order("name")
  ]);
  sitesList = s.data || [];
  templatesList = t.data || [];
  shell();
  go(location.hash.slice(1) || visibleNav()[0][0]);
}

/* ============ SHELL (sidebar on computers, bottom menu on phones) ============ */
function shell() {
  const nav = visibleNav();
  const locked = me.role === "hse_officer";
  root.innerHTML = `
    <div class="layout">
      <aside class="side">
        <div class="brand"><span class="logo">E</span> EHS Management</div>
        ${nav.map(([k, l]) => `<a href="#${k}" data-nav="${k}">${l}</a>`).join("")}
        <div class="who">
          <b>${esc(me.full_name || "")}</b>
          <span>${esc(ROLE_NAMES[me.role] || me.role)}</span>
          <button id="signout" type="button">Sign out</button>
        </div>
      </aside>
      <div class="content">
        <header class="topbar">
          <div>
            <h1 id="pageTitle"></h1>
            <div class="sub" id="pageSub"></div>
          </div>
          <div class="tools">
            <select id="siteSel" aria-label="Site" ${locked ? "disabled" : ""}>
              ${locked ? siteOptions(me.site_id) : `<option value="">All sites</option>${siteOptions(siteFilter)}`}
            </select>
            <button class="btn sm mobile-out" id="signoutTop" type="button">Sign out</button>
          </div>
        </header>
        <main id="main"></main>
      </div>
      <nav class="bottom">${nav.map(([k, l]) => `<a href="#${k}" data-nav="${k}">${l}</a>`).join("")}</nav>
    </div>
    <div id="toast" class="toast"></div>`;
  $("#signout").onclick = () => sb.auth.signOut();
  $("#signoutTop").onclick = () => sb.auth.signOut();
  $("#siteSel").onchange = (e) => { siteFilter = e.target.value; go(view); };
  window.onhashchange = () => go(location.hash.slice(1));
}

const VIEWS = { dashboard: viewDashboard, report: viewReport, inspect: viewInspect, actions: viewActions, documents: viewDocuments };
const TITLES = Object.fromEntries(NAV.map(([k, l, s]) => [k, [l, s]]));

function go(tab) {
  const allowed = visibleNav().map(n => n[0]);
  if (!allowed.includes(tab)) tab = allowed[0];
  view = tab;
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === tab));
  if (location.hash.slice(1) !== tab) history.replaceState(null, "", "#" + tab);
  $("#pageTitle").textContent = TITLES[tab][0];
  $("#pageSub").textContent = siteFilter ? siteName(siteFilter) : TITLES[tab][1];
  VIEWS[tab]();
}

/* ============ DASHBOARD ============ */
const bySite = (q) => (siteFilter ? q.eq("site_id", siteFilter) : q);

async function viewDashboard() {
  $("#main").innerHTML = `<div class="empty">Loading dashboard…</div>`;
  const today = todayStr(), soon = plusDays(60);
  const [k, a, c, t, r] = await Promise.all([
    bySite(sb.from("v_monthly_kpi").select("*").gte("period", monthStart(-11)).order("period")),
    bySite(sb.from("actions").select("*").neq("status", "Closed").order("due_date", { ascending: true, nullsFirst: false })),
    bySite(sb.from("certificates").select("*").not("expiry", "is", null).lte("expiry", soon).order("expiry")),
    bySite(sb.from("training").select("*").not("expiry", "is", null).lte("expiry", soon).order("expiry")),
    bySite(sb.from("incidents").select("*").order("occurred_at", { ascending: false }).limit(6))
  ]);
  const failed = [k, a, c, t, r].find(x => x.error);
  if (failed) { $("#main").innerHTML = `<div class="card err">Could not load data: ${esc(failed.error.message)}</div>`; return; }

  const months = {};
  for (const x of k.data) {
    const m = (months[x.period] ||= { hours: 0, rec: 0, lti: 0, nm: 0 });
    m.hours += Number(x.hours); m.rec += Number(x.recordable); m.lti += Number(x.lti); m.nm += Number(x.near_miss);
  }
  const keys = Object.keys(months).sort();
  const tot = keys.reduce((z, key) => ({
    hours: z.hours + months[key].hours, rec: z.rec + months[key].rec,
    lti: z.lti + months[key].lti, nm: z.nm + months[key].nm
  }), { hours: 0, rec: 0, lti: 0, nm: 0 });
  const ltifr = tot.hours ? tot.lti * 1e6 / tot.hours : null;
  const trir = tot.hours ? tot.rec * 2e5 / tot.hours : null;
  const trirOf = (m) => (m.hours ? m.rec * 2e5 / m.hours : 0);
  const maxT = Math.max(0, ...keys.map(key => trirOf(months[key])));
  const overdue = a.data.filter(x => x.due_date && x.due_date < today);
  const expiring = [

      <section class="grid two">

                <div class="meta">${esc(siteName(x.site_id))} · Owner: ${esc(x.owner || "—")} · Due ${esc(x.due_date || "—")}</div></div>
              <span class="pill ${x.due_date && x.due_date < today ? "bad" : "warn"}">${x.due_date && x.due_date < today ? "Overdue" : "Open"}</span>

              </div>
              <input name="n_${i}" placeholder="Note (required if Fail)">
            </div>`).join("")}

          <button class="btn primary block" type="submit">Submit inspection</button>
        </form>

async function submitChecklist(e, tpl) {
  e.preventDefault();
  const f = e.target;
  const siteId = f.site_id.value;
  if (!siteId) return toast("Choose a site", false);
  const days = Number(f.days.value) || 7;
  const answers = {};
  const failures = [];
  let pass = 0, fail = 0, na = 0;
  tpl.items.forEach((it, i) => {
    const result = f[`r_${i}`].value;
    const note = f[`n_${i}`].value.trim();
    answers[it.id] = { result, note };
    if (result === "pass") pass++;
    else if (result === "fail") { fail++; failures.push({ it, note }); }
    else na++;
  });
  if (failures.some(x => !x.note)) return toast("Add a note for every failed item", false);

  const score = pass + fail ? Math.round(pass / (pass + fail) * 1000) / 10 : null;
  const { data, error } = await sb.from("inspections").insert({
    site_id: siteId, template_id: tpl.id,
    inspected_at: new Date(f.when.value + "T09:00:00").toISOString(),
    answers, score, fails: fail
  }).select().single();
  if (error) return toast("Not saved: " + error.message, false);

  if (failures.length) {
    const rows = failures.map(x => ({
      site_id: siteId,
      source_inspection_id: data.id,
      description: `${tpl.name}: ${x.it.text} (${x.note})`,
      due_date: plusDays(x.it.critical ? Math.min(days, 3) : days),
      status: "Open"
    }));
    const { error: e2 } = await sb.from("actions").insert(rows);
    if (e2) return toast("Inspection saved, but actions failed: " + e2.message, false);
  }
  activeTpl = null;
  toast(`Saved. Score ${score ?? "—"}%. ${failures.length} action(s) created.`);
  $("#main").innerHTML = `
    <div class="card" style="max-width:560px">
      <h2>Inspection saved</h2>
      <p style="font-size:28px;font-weight:750;margin:10px 0 4px">${score ?? "—"}%</p>
      <p class="muted">Pass ${pass} · Fail ${fail} · N/A ${na}</p>
      <p class="muted small">Failed items are now corrective actions. Track them on the Actions page.</p>
      <div class="right" style="justify-content:flex-start;margin-top:14px">
        <button class="btn primary" id="again" type="button">Another inspection</button>
        <a class="btn" href="#actions">View actions</a>
      </div>
    </div>`;
  $("#again").onclick = () => viewInspect();
}

function viewActions() {

async function loadActions() {
  const today = todayStr();
  let q = bySite(sb.from("actions").select("*").order("due_date", { ascending: true, nullsFirst: false }));
  q = actFilter === "closed" ? q.eq("status", "Closed") : q.neq("status", "Closed");
  const { data, error } = await q;
  if (error) { $("#actList").innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
  let rows = data;
  if (actFilter === "overdue") rows = rows.filter(x => x.due_date && x.due_date < today);
  $("#actList").innerHTML = rows.length ? `<div class="list">${rows.map(x => {
    const od = x.status !== "Closed" && x.due_date && x.due_date < today;
    return `<div class="li ${od ? "over" : ""}">
      <div><div style="font-weight:600">${esc(x.description)}</div>
        <div class="meta">${esc(siteName(x.site_id))} · Owner: ${esc(x.owner || "—")} · Due ${esc(x.due_date || "—")}</div></div>
      <div class="right">
        ${od ? '<span class="pill bad">Overdue</span>' : x.status === "Closed" ? '<span class="pill ok">Closed</span>' : '<span class="pill warn">Open</span>'}
        ${canWrite() && x.status !== "Closed" ? `<button class="btn sm" data-close="${x.id}">Mark closed</button>` : ""}
      </div>
    </div>`;
  }).join("")}</div>` : `<div class="empty">Nothing here.</div>`;
  document.querySelectorAll("[data-close]").forEach(b => { b.onclick = () => closeAction(b.dataset.close); });
}

/* ============ DOCUMENTS ============ */
async function viewDocuments() {
  const [d, ak] = await Promise.all([
    sb.from("documents").select("*").order("updated_at", { ascending: false }),
    sb.from("document_acks").select("document_id").eq("user_id", me.id)
  ]);
  if (d.error) { $("#main").innerHTML = `<div class="card err">${esc(d.error.message)}</div>`; return; }
  ackSet = new Set((ak.data || []).map(x => x.document_id));
  const canUp = canWrite();
  $("#main").innerHTML = `
    <div class="stack">
      <div class="sec-head">
        <div class="muted small">Read only for most people. "I have read this" records your acknowledgement. Downloads are logged.</div>
        ${canUp ? `<button class="btn primary" id="toggleUp" type="button">${docUploadOpen ? "Close upload" : "Upload document"}</button>` : ""}
      </div>
      ${canUp && docUploadOpen ? uploadPanel() : ""}
      <div class="card">
        ${d.data.length ? `<div class="list">${d.data.map(docRow).join("")}</div>`
          : `<div class="empty">No documents yet.${canUp ? " Upload the first one." : ""}</div>`}
      </div>
    </div>`;
  if ($("#toggleUp")) $("#toggleUp").onclick = () => { docUploadOpen = !docUploadOpen; viewDocuments(); };
  bindDocs();
  bindUpload();
}

function docRow(x) {
  const due = x.review_due ? daysUntil(x.review_due) : null;
  const dueTag = due === null ? "" : due < 0 ? '<span class="pill bad">Review overdue</span>'
    : due <= 30 ? `<span class="pill warn">Review in ${due} d</span>` : "";
  const statusCls = x.status === "Approved" ? "ok" : x.status === "Obsolete" ? "bad" : "warn";
  return `<div class="li">
    <div>
      <div style="font-weight:600">${esc(x.title)} ${x.restricted ? '<span class="pill info">Restricted</span>' : ""}</div>
      <div class="meta">${esc(x.doc_no || "No doc no.")} · v${esc(x.version)} · ${esc(x.category || "")} · ${esc(siteName(x.site_id))}</div>
      <div class="right" style="justify-content:flex-start;margin-top:8px">
        <span class="pill ${statusCls}">${esc(x.status)}</span> ${dueTag}
      </div>
    </div>
    <div class="right">
      <button class="btn sm primary" data-open="${x.id}">Open</button>
      ${ackSet.has(x.id) ? '<span class="pill ok">Read</span>' : `<button class="btn sm" data-ack="${x.id}">I have read this</button>`}
      ${isAdmin() ? `<button class="btn sm danger" data-del="${x.id}">Delete</button>` : ""}
    </div>
  </div>`;
}

function bindDocs() {
  document.querySelectorAll("[data-open]").forEach(b => { b.onclick = () => openDoc(b.dataset.open); });
  document.querySelectorAll("[data-ack]").forEach(b => {
    b.onclick = async () => {
      const { error } = await sb.from("document_acks").insert({ document_id: b.dataset.ack, user_id: me.id });
      if (error) return toast(error.message, false);
      toast("Recorded. Thank you.");
      viewDocuments();
    };
  });
  document.querySelectorAll("[data-del]").forEach(b => { b.onclick = () => deleteDoc(b.dataset.del); });
}

async function openDoc(id) {
  const win = window.open("", "_blank");   // opened first so phone browsers don't block it
  const { data, error } = await sb.from("documents").select("storage_path,title").eq("id", id).single();
  if (error || !data) { if (win) win.close(); return toast("You don't have access to this document.", false); }
  const { data: s, error: e2 } = await sb.storage.from("ehs-documents").createSignedUrl(data.storage_path, 300);
  if (e2) { if (win) win.close(); return toast("Could not open: " + e2.message, false); }
  sb.from("audit_log").insert({ action: "open", table_name: "documents", record_id: id });
  if (win) win.location.href = s.signedUrl; else window.location.href = s.signedUrl;
}

async function deleteDoc(id) {
  if (!confirm("Delete this document permanently? This cannot be undone.")) return;
  const { data } = await sb.from("documents").select("storage_path").eq("id", id).single();
  if (data) await sb.storage.from("ehs-documents").remove([data.storage_path]);
  const { error } = await sb.from("documents").delete().eq("id", id);
  if (error) return toast(error.message, false);
  toast("Document deleted");
  viewDocuments();
}

function uploadPanel() {
  return `<section class="card">
    <h2 style="margin-bottom:14px">Upload controlled document</h2>
    <form id="upForm" class="fgrid">
      <label class="full">File (PDF, Word or Excel, up to 50 MB)<input type="file" name="file" required></label>
      <label class="full">Title<input name="title" required></label>
      <label>Document number<input name="doc_no" placeholder="e.g. HSE-PLN-001"></label>
      <label>Version<input name="version" value="1.0"></label>
      <label>Category<select name="category">${DOC_CATS.map(c => `<option>${esc(c)}</option>`).join("")}</select></label>
      <label>Status<select name="status">${DOC_STATUS.map(c => `<option>${c}</option>`).join("")}</select></label>
      <label>Site<select name="site_id"><option value="">All sites</option>${siteOptions(siteFilter)}</select></label>
      <label>Next review date<input type="date" name="review_due" value="${plusDays(365)}"></label>
      <label class="check full"><input type="checkbox" name="restricted"> Restricted: only people the admin adds can open it</label>
      <div class="full"><button class="btn primary" type="submit">Upload</button>
      <span class="muted small" id="upMsg" role="status" style="margin-left:10px"></span></div>
    </form></section>`;
}

function bindUpload() {
  const f = $("#upForm");
  if (!f) return;
  f.onsubmit = async (e) => {
    e.preventDefault();
    const file = f.file.files[0];
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) return toast("File is larger than 50 MB", false);
    const path = `${crypto.randomUUID()}/${file.name.replace(/[^\w.-]/g, "_")}`;
    const row = {
      title: f.title.value.trim(),
      doc_no: f.doc_no.value.trim() || null,
      version: f.version.value.trim() || "1.0",
      category: f.category.value,
      status: f.status.value,
      site_id: f.site_id.value || null,
      review_due: f.review_due.value || null,
      restricted: f.restricted.checked,
      storage_path: path,
      file_name: file.name
    };
    $("#upMsg").textContent = "Uploading…";
    const { error } = await sb.from("documents").insert(row);
    if (error) { $("#upMsg").textContent = "Not saved: " + error.message; return; }
    const { error: e2 } = await sb.storage.from("ehs-documents").upload(path, file, {
      contentType: file.type || "application/octet-stream", upsert: false
    });
    if (e2) {
      await sb.from("documents").delete().eq("storage_path", path);
      $("#upMsg").textContent = "Upload failed: " + e2.message;
      return;
    }
    docUploadOpen = false;
    toast("Document uploaded");
    viewDocuments();
  };
}

/* ============ START ============ */
boot();
</script>
</body>
</html>
