<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>EHS Command</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#F1F5F9;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--brand:#2563EB;--brand2:#1E3A8A;--navy:#0F172A;--ok:#059669;--okbg:#D1FAE5;--warn:#B45309;--warnbg:#FEF3C7;--bad:#DC2626;--badbg:#FEE2E2;--r:16px;--sh:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.06)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid #CBD5E1;border-radius:12px;background:#fff;outline:none}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px #DBEAFE}
label{display:block;font-size:13px;font-weight:700;color:#334155;margin:12px 0 6px}
h1{font-size:22px;margin:0 0 2px;line-height:1.25}
h2{font-size:16px;margin:0}
a{color:var(--brand)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;gap:10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #CBD5E1}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#E2E8F0;color:#334155;white-space:nowrap}
.chip.ok{background:var(--okbg);color:#047857}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.blue{background:#DBEAFE;color:#1D4ED8}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;min-height:116px;border:2px solid transparent}
.tile:active{border-color:var(--brand)}
.tile .ic{font-size:28px;width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:#EFF6FF}
.tile b{font-size:15px}
.tile small{color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:800px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg a{flex:1;min-width:110px;text-align:center;padding:11px 10px;border-radius:12px;background:#F1F5F9;text-decoration:none;color:#334155;font-weight:700;font-size:14px}
.seg a.on{background:#EFF6FF;color:var(--brand2);box-shadow:inset 0 0 0 2px var(--brand)}
.sec{margin:20px 0 10px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.list>*+*{margin-top:10px}
.item{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--sh);border-left:5px solid #CBD5E1}
.item.hi{border-left-color:var(--bad)}
.item.md{border-left-color:#F59E0B}
.item.lo{border-left-color:var(--ok)}
.item.blue{border-left-color:var(--brand)}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.empty .ic{font-size:42px}
.shield{background:#EFF6FF;font-size:14px;margin-bottom:14px}
.bar{height:12px;border-radius:99px;background:#E2E8F0;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#60A5FA,#2563EB)}
.bar.bad>i{background:linear-gradient(90deg,#FCA5A5,#DC2626)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
.pf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pf button{padding:12px 6px;border-radius:12px;border:2px solid #E2E8F0;background:#fff;font-weight:700;cursor:pointer}
.pf button.p{color:#166534}
.pf button.f{color:#991B1B}
.pf button.n{color:#334155}
.pf button.p.on{background:#DCFCE7;border-color:#16A34A}
.pf button.f.on{background:#FEE2E2;border-color:#DC2626}
.pf button.n.on{background:#F1F5F9;border-color:#64748B}
.check-row{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--sh);margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:60;max-width:92vw;font-weight:600;text-align:center}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0F172A,#1E3A8A)}
.login .card{width:100%;max-width:380px}
.badge{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#2563EB,#7C3AED);display:grid;place-items:center;font-size:34px;margin:0 auto 10px}
/* layout */
.app{min-height:100vh}
.side{display:none}
.main{padding:16px 14px 110px;min-width:0}
.top{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.top select{width:auto;min-width:170px;padding:9px 12px;border-radius:12px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
.nav a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 0 8px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700}
.nav a .ic{font-size:21px}
.nav a.on{color:var(--brand)}
.nav a.on .ic{transform:scale(1.12)}
@media(min-width:960px){
  .app{display:grid;grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;background:var(--navy);color:#CBD5E1;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
  .side a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;color:#CBD5E1;text-decoration:none;font-weight:600}
  .side a:hover{background:#1E293B;color:#fff}
  .side a.on{background:var(--brand);color:#fff}
  .side .ic{font-size:18px;width:24px;text-align:center}
  .nav{display:none}
  .main{padding:26px 34px 40px}
}
.brand{display:flex;gap:10px;align-items:center;color:#fff;font-weight:800;padding:6px 8px 18px}
.brand .logo{font-size:28px}
.brand small{display:block;font-weight:500;color:#94A3B8;font-size:12px}
.who{margin-top:auto;border-top:1px solid #334155;padding:14px 8px 0;color:#CBD5E1;font-size:13px}
.who b{display:block;color:#fff}
.who button{margin-top:10px;width:100%;background:transparent;border:1px solid #334155;color:#CBD5E1;border-radius:10px;padding:8px;cursor:pointer}
</style>
</head>
<body>

<div id="boot" class="login"><div class="card" style="text-align:center"><div class="badge">🦺</div><h2>Loading…</h2></div></div>

<div id="login" class="login hidden">
  <form class="card" id="lf">
    <div class="badge">🦺</div>
    <h1 style="text-align:center">EHS Command</h1>
    <p class="muted small" style="text-align:center;margin:0 0 6px">One platform for the whole HSE team</p>
    <label>📧 Email</label>
    <input id="le" type="email" autocomplete="username" required>
    <label>🔒 Password</label>
    <input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn block" style="margin-top:18px">Sign in →</button>
    <p class="small" style="text-align:center"><button type="button" class="btn ghost sm" id="forgot">Forgot password?</button></p>
    <p class="small muted" id="lmsg"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="side" id="side"></aside>
  <div><main class="main" id="main"></main></div>
  <nav class="nav" id="bottomnav"></nav>
</div>

<script>
/* ===================== SETTINGS (change here when needed) ===================== */
const CONFIG = {
  url: "https://caygfknyxprkycyzbnhi.supabase.co",
  key: "sb_publishable_s2s8S_cALkToUQdWBtCKyg_L9JOvMpp",
  bucket: "ehs-documents",
  project: "EPC Project · HSE"
};

/* ===================== ROLES AND PERMISSIONS =====================
   The database enforces these rules too. This list only decides what buttons and pages each person sees. */
const ROLES = {
  admin:      {label:"System admin", ic:"🛠️"},
  md:         {label:"MD", ic:"👑"},
  gm:         {label:"GM", ic:"🏢"},
  hod:        {label:"HOD", ic:"🏛️"},
  hse_head:   {label:"HSE Head", ic:"🛡️"},
  manager:    {label:"Manager", ic:"📈"},
  supervisor: {label:"Supervisor", ic:"👷"},
  officer:    {label:"HSE Officer", ic:"🦺"},
  viewer:     {label:"Viewer", ic:"👀"},
  contractor: {label:"Contractor", ic:"🧰"}
};
const CAN = {
  enter:       ["admin","hse_head","supervisor","officer"],
  approve:     ["admin","md","gm","hod","hse_head","manager"],
  upload:      ["admin","hse_head","manager"],
  admin:       ["admin"],
  projectWide: ["admin","md","gm","hod","hse_head","manager","viewer"]
};
const ENTRY_TYPES = [
  {id:"incident",         ic:"🚨", t:"Incident",         d:"Injury, damage or spill"},
  {id:"near_miss",        ic:"🟡", t:"Near miss",        d:"Could have hurt someone"},
  {id:"unsafe_condition", ic:"⚠️", t:"Unsafe condition", d:"Hazard seen on site"}
];
const CLASSES = ["First aid","Medical treatment","Restricted work","Lost time","Fatality","Property damage","Environmental release"];
const CLASS_IC = {"First aid":"🩹","Medical treatment":"🏥","Restricted work":"🛌","Lost time":"⛔","Fatality":"🕯️","Property damage":"🔧","Environmental release":"🌫️"};
const catIc = c => ({"Daily":"☀️","Permit to Work":"📝","PPE":"🦺","Height":"🪜","Lifting":"🏗️","Scaffolding":"🧱","Excavation":"⛏️","Electrical":"⚡","Fire":"🔥","Housekeeping":"🧹","Vehicle":"🚚","First Aid":"🩹","Environment":"🌿","Chemicals":"🧪","Training":"🎤","Audit":"🔎"})[c] || "📋";

/* ===================== HELPERS ===================== */
const sb = supabase.createClient(CONFIG.url, CONFIG.key);
const S = {user:null, profile:null, sites:[], site:"all", route:"home", arg:"", last:null, range:null, tpl:null};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const localISO = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const addDays = n => localISO(new Date(Date.now() + n*864e5));
const fd = d => d ? new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) : "–";
const ft = d => d ? new Date(d).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}) : "–";
const fmtN = n => Number(n||0).toLocaleString("en-IN");
const first = n => (n||"there").split(/[ @]/)[0];
const role = () => S.profile?.role || "viewer";
const can = k => CAN[k].includes(role());
const pw = () => CAN.projectWide.includes(role());
const sf = (q, col="site_id") => (S.site === "all" ? q : q.eq(col, S.site));
const fdata = f => Object.fromEntries(new FormData(f));
const nowLocal = () => localISO() + "T" + new Date().toTimeString().slice(0,5);
const greet = () => { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; };
const roleChip = r => `<span class="chip blue">${ROLES[r]?.ic || ""} ${esc(ROLES[r]?.label || r || "")}</span>`;
const kpi = (ic, v, l) => `<div class="kpi"><div style="font-size:22px">${ic}</div><div class="v">${v}</div><div class="l">${l}</div></div>`;
const empty = (ic, msg) => `<div class="empty card"><div class="ic">${ic}</div>${msg}</div>`;
const exportBtn = () => `<button class="btn ghost sm" data-act="export">⬇️ Export to Excel (CSV)</button>`;
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
function err(e){ const m = e?.message || e; toast("⚠️ " + m); console.error(e); }
async function run(p){ const r = await p; if (r.error) throw r.error; return r.data; }
function audit(action, table, id){ sb.from("audit_log").insert({action, table_name: table, record_id: String(id || "")}).then(() => {}); }
const denied = () => { $("#main").innerHTML = header("🔒 Not for your role") + empty("🔒", 'Your role does not have access to this page.<br><a href="#home">Go to Home</a>'); };
function header(title, sub = "", right = ""){
  return `<div class="top"><div><h1>${title}</h1><div class="muted small">${sub}</div></div><div class="row" style="justify-content:flex-end">${right}${siteSelect()}</div></div>`;
}
function siteSelect(){
  return `<select id="siteSel" aria-label="Area">${pw() ? '<option value="all">🏗️ All areas</option>' : ''}${S.sites.map(s => `<option value="${s.id}" ${S.site === s.id ? "selected" : ""}>📍 ${esc(s.name)}</option>`).join("")}</select>`;
}
function siteField(name = "site_id"){
  return `<select name="${name}" required>${S.sites.map(s => `<option value="${s.id}" ${S.site === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select>`;
}
function shield(){
  const name = S.site === "all" ? "All areas" : (S.sites.find(s => s.id === S.site)?.name || "");
  return pw()
    ? `<div class="card shield">🔒 Showing <b>${esc(name)}</b> · your role sees all areas</div>`
    : `<div class="card shield">🔒 Showing <b>${esc(name)}</b> · your role sees your own area. <a href="#access">Request access</a> to see others.</div>`;
}
function agg(rows){
  const t = {hours:0, recordable:0, lti:0, near:0};
  rows.forEach(r => { t.hours += +r.hours || 0; t.recordable += +r.recordable || 0; t.lti += +r.lti || 0; t.near += +r.near_miss || 0; });
  t.ltifr = t.hours ? t.lti * 1e6 / t.hours : 0;
  t.trir = t.hours ? t.recordable * 2e5 / t.hours : 0;
  return t;
}
function expItem(title, sub, expiry, site){
  const dd = expiry ? Math.ceil((new Date(expiry) - new Date(localISO())) / 864e5) : null;
  const chip = dd === null ? '<span class="chip">No expiry</span>' : dd < 0 ? '<span class="chip bad">❌ Expired</span>' : dd <= 60 ? `<span class="chip warn">⚠️ ${dd} days left</span>` : '<span class="chip ok">✅ Valid</span>';
  const cls = dd === null ? "" : dd < 0 ? "hi" : dd <= 60 ? "md" : "lo";
  return `<div class="item ${cls}"><div class="row"><b>${esc(title)}</b>${chip}</div><div class="small muted" style="margin-top:6px">${esc(sub || "")} · 📍 ${esc(site || "")} · exp ${fd(expiry)}</div></div>`;
}
function docChip(s){ return `<span class="chip ${s === "Approved" ? "ok" : s === "Obsolete" ? "bad" : s === "In review" ? "warn" : ""}">${esc(s)}</span>`; }
function statusChip(r){
  if (r.status === "pending") return '<span class="chip warn">⏳ Pending</span>';
  if (r.status === "rejected") return '<span class="chip bad">❌ Rejected</span>';
  if (r.expires_at && new Date(r.expires_at) > new Date()) return `<span class="chip ok">✅ Until ${fd(r.expires_at)}</span>`;
  return '<span class="chip">⌛ Expired</span>';
}
function exportCSV(name, rows, cols){
  const lines = [cols.map(c => c[0]).join(",")].concat(rows.map(r => cols.map(c => {
    const v = typeof c[1] === "function" ? c[1](r) : r[c[1]];
    return '"' + String(v ?? "").replace(/"/g, '""') + '"';
  }).join(",")));
  const blob = new Blob(["﻿" + lines.join("\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + "-" + localISO() + ".csv";
  a.click();
  audit("export", name, rows.length);
}

/* ===================== NAVIGATION ===================== */
function items(){
  return [
    {id:"home",        ic:"🏠", t:"Home"},
    {id:"enter",       ic:"➕", t:"Enter data",     ok: can("enter")},
    {id:"actions",     ic:"✅", t:"Actions"},
    {id:"inspections", ic:"📋", t:"Inspections"},
    {id:"reports",     ic:"📊", t:"Reports"},
    {id:"approvals",   ic:"🔑", t:"Approvals",      ok: can("approve")},
    {id:"docs",        ic:"📁", t:"Documents"},
    {id:"training",    ic:"🎓", t:"Training & certs"},
    {id:"access",      ic:"🔓", t:"Request access"},
    {id:"admin",       ic:"🛠️", t:"Admin",          ok: can("admin")}
  ].filter(i => i.ok !== false);
}
function bottom(){
  return [
    {id:"home", ic:"🏠", t:"Home"},
    can("enter") ? {id:"enter", ic:"➕", t:"Enter"} : {id:"actions", ic:"✅", t:"Actions"},
    {id:"reports", ic:"📊", t:"Reports"},
    can("approve") ? {id:"approvals", ic:"🔑", t:"Approve"} : {id:"docs", ic:"📁", t:"Docs"},
    {id:"more", ic:"☰", t:"More"}
  ];
}
function buildNav(){
  $("#side").innerHTML = `<div class="brand"><span class="logo">🦺</span><div>EHS Command<small>${esc(CONFIG.project)}</small></div></div>`
    + items().map(i => `<a href="#${i.id}" data-r="${i.id}"><span class="ic">${i.ic}</span>${i.t}</a>`).join("")
    + `<div class="who"><b>${esc(S.profile.full_name || "")}</b>${ROLES[role()]?.label || role()}<button type="button" data-act="signout">🚪 Sign out</button></div>`;
  $("#bottomnav").innerHTML = bottom().map(i => `<a href="#${i.id}" data-r="${i.id}"><span class="ic">${i.ic}</span>${i.t}</a>`).join("");
}
function highlight(){ document.querySelectorAll("[data-r]").forEach(a => a.classList.toggle("on", a.dataset.r === S.route)); }

const PAGES = {};
async function route(){
  if (!S.user) return;
  const h = (location.hash || "#home").slice(1);
  const i = h.indexOf("/");
  S.route = i < 0 ? h : h.slice(0, i);
  S.arg = i < 0 ? "" : h.slice(i + 1);
  highlight();
  const page = PAGES[S.route] || PAGES.home;
  $("#main").innerHTML = '<div class="empty"><div class="ic">⏳</div>Loading…</div>';
  try { await page(S.arg); }
  catch (e) { err(e); $("#main").innerHTML = header("⚠️ Could not load this page") + `<div class="card small">${esc(e.message || e)}<br><br>If this is a new feature, the database update may not be run yet.</div>`; }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ===================== LOGIN AND START ===================== */
async function loadProfile(){ S.profile = await run(sb.from("profiles").select("*").eq("id", S.user.id).single()); }
async function loadSites(){ S.sites = await run(sb.from("sites").select("id,name,location").order("name")); }
async function startApp(user){
  S.user = user;
  await loadProfile();
  await loadSites();
  S.site = pw() ? "all" : (S.profile.site_id || S.sites[0]?.id || "all");
  buildNav();
  $("#boot").classList.add("hidden");
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  if (!location.hash) location.hash = "#home"; else route();
}
function showLogin(){ $("#boot").classList.add("hidden"); $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }
(async () => {
  const {data} = await sb.auth.getSession();
  if (data.session) await startApp(data.session.user); else showLogin();
})().catch(e => { showLogin(); toast("⚠️ " + (e.message || e)); });

$("#lf").addEventListener("submit", async e => {
  e.preventDefault();
  $("#lmsg").textContent = "Signing in…";
  try {
    const {data, error} = await sb.auth.signInWithPassword({email: $("#le").value.trim(), password: $("#lp").value});
    if (error) throw error;
    await startApp(data.user);
  } catch (x) { $("#lmsg").textContent = "❌ " + x.message; }
});
$("#forgot").addEventListener("click", async () => {
  const em = $("#le").value.trim();
  if (!em) return toast("Type your email first");
  const {error} = await sb.auth.resetPasswordForEmail(em);
  toast(error ? "⚠️ " + error.message : "📧 Reset link sent to your email");
});

/* ===================== HOME ===================== */
PAGES.home = async () => {
  const yr = localISO().slice(0,4) + "-01-01";
  const [kRows, openRows, lastLti, recent] = await Promise.all([
    run(sf(sb.from("v_monthly_kpi").select("*")).gte("period", yr)),
    run(sf(sb.from("actions").select("id,status,due_date")).neq("status", "Closed").limit(1000)),
    run(sf(sb.from("incidents").select("occurred_at")).in("classification", ["Lost time","Fatality"]).order("occurred_at", {ascending:false}).limit(1)),
    run(sf(sb.from("incidents").select("id,event_type,classification,description,occurred_at,area,sites(name),reporter:profiles!reported_by(full_name)")).order("occurred_at", {ascending:false}).limit(6))
  ]);
  const a = agg(kRows);
  const overdue = openRows.filter(r => r.due_date && r.due_date < localISO()).length;
  const days = lastLti.length ? Math.floor((Date.now() - new Date(lastLti[0].occurred_at)) / 864e5) : null;
  const siteName = S.site === "all" ? "All areas" : (S.sites.find(s => s.id === S.site)?.name || "");
  const quick = can("enter")
    ? [["incident","🚨","Report incident","Injury, damage, spill"],["near_miss","🟡","Near miss","Something almost happened"],["unsafe_condition","⚠️","Unsafe condition","Hazard seen on site"],["manhours","⏱️","Manhours","Hours worked this month"],["inspections","✅","Inspection","Run a checklist"],["training","🎓","Training","Add a training record"]]
    : [["reports","📊","Reports","KPIs and registers"],["approvals","🔑","Approvals","Approve access requests"],["docs","📁","Documents","Read and acknowledge"],["access","🔓","Request access","See another area"]];
  const quickHref = q => q[0] === "incident" || q[0] === "near_miss" || q[0] === "unsafe_condition" || q[0] === "manhours" || q[0] === "training" ? `#enter/${q[0]}` : `#${q[0]}`;
  $("#main").innerHTML = `
    ${header(`${greet()}, ${esc(first(S.profile.full_name))} 👋`, `${roleChip(role())} <span class="muted">· ${esc(siteName)}</span>`)}
    ${shield()}
    <div class="kpis">
      ${kpi("🏅", days === null ? "–" : days, days === null ? "No LTI on record 🎉" : "days without a lost-time injury")}
      ${kpi("📉", a.ltifr.toFixed(2), "LTIFR (this year)")}
      ${kpi("🩹", a.recordable, "Recordable injuries (YTD)")}
      ${kpi("🟡", a.near, "Near misses (YTD)")}
      ${kpi("⏱️", fmtN(a.hours), "Manhours (YTD)")}
      ${kpi("⏳", openRows.length, "Open actions")}
      ${kpi("⛔", overdue, "Overdue actions")}
    </div>
    <div class="sec">⚡ Quick actions</div>
    <div class="tiles">${quick.map(q => `<a class="tile" href="${quickHref(q)}"><div class="ic">${q[1]}</div><b>${q[2]}</b><small>${q[3]}</small></a>`).join("")}</div>
    <div class="sec">🕒 Latest reports</div>
    <div class="list">${recent.map(r => `<div class="item ${r.event_type === "incident" ? "hi" : r.event_type === "near_miss" ? "md" : "blue"}">
      <div class="row"><b>${ENTRY_TYPES.find(t => t.id === r.event_type)?.ic || "📝"} ${esc(r.classification || ENTRY_TYPES.find(t => t.id === r.event_type)?.t)}</b><span class="small muted">${ft(r.occurred_at)}</span></div>
      <div class="small" style="margin-top:6px">${esc(r.description).slice(0,120)}</div>
      <div class="small muted" style="margin-top:6px">📍 ${esc(r.sites?.name || "")} · ${esc(r.area || "")} · 👤 ${esc(r.reporter?.full_name || "")}</div>
    </div>`).join("") || empty("📭", "No reports yet. Tap 🚨 Report incident to start.")}</div>`;
};

/* ===================== ENTER DATA ===================== */
PAGES.enter = async (arg) => {
  if (!can("enter")) return denied();
  const sub = (arg || "").split("/")[0];
  if (!sub) return enterHub();
  if (["incident","near_miss","unsafe_condition"].includes(sub)) return formIncident(sub);
  if (sub === "manhours") return formManhours();
  if (sub === "training") return formTraining();
  if (sub === "cert") return formCert();
  if (sub === "action") return formAction();
  return enterHub();
};
function enterHub(){
  const tiles = [
    ["enter/incident","🚨","Incident","Injury, damage or spill"],
    ["enter/near_miss","🟡","Near miss","Could have hurt someone"],
    ["enter/unsafe_condition","⚠️","Unsafe condition","Hazard seen on site"],
    ["enter/manhours","⏱️","Manhours","Hours worked per month"],
    ["inspections","✅","Inspection","Run a checklist"],
    ["enter/training","🎓","Training","Competency and expiry"],
    ["enter/cert","📜","Certificate","Licence, permit, cert"],
    ["enter/action","🛠️","Corrective action","Assign an owner"]
  ];
  if (can("upload")) tiles.push(["docs/new","📄","Upload document","Procedure, form, plan"]);
  $("#main").innerHTML = header("➕ Enter data", "Pick what you want to record") +
    `<div class="tiles">${tiles.map(t => `<a class="tile" href="#${t[0]}"><div class="ic">${t[1]}</div><b>${t[2]}</b><small>${t[3]}</small></a>`).join("")}</div>`;
}
function formIncident(kind){

  <div class="card">
    <div class="seg">${ENTRY_TYPES.map(t => `<a class="${t.id === kind ? "on" : ""}" href="#enter/${t.id}">${t.ic} ${t.t}</a>`).join("")}</div>
    <form id="fInc" data-kind="${kind}">
      <label>🏗️ Area</label>${siteField()}
      <label>📅 When did it happen?</label>
      <input type="datetime-local" name="occurred_at" value="${nowLocal()}" required>
      <label>📍 Exact place</label>
      <input name="area" placeholder="e.g. Block B, scaffold level 3" required>
      ${kind === "incident" ? `<label>🏷️ Type of injury or damage</label><select name="classification" required>${CLASSES.map(c => `<option>${CLASS_ICON(c)} ${c}</option>`).join("")}</select>` : ""}
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">

      <label>📝 What happened?</label>
      <textarea name="description" rows="4" required placeholder="Who, what, how. Keep it factual."></textarea>
      <label>🔍 Root cause (if known)</label>
      <textarea name="root_cause" rows="2"></textarea>
      <div class="card" style="background:#F8FAFC;margin-top:14px;box-shadow:none">
        <b>🛠️ Corrective action (optional)</b>
        <label>What will be done?</label><input name="ac_desc">
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">
          <div><label>👤 Owner</label><input name="ac_owner"></div>
          <div><label>📅 Due</label><input type="date" name="ac_due" value="${addDays(14)}"></div>

PAGES.inspections = async () => {
  const [tpls, recent] = await Promise.all([
    run(sb.from("checklist_templates").select("id,name,category,items").order("category")),
    run(sf(sb.from("inspections").select("id,score,fails,inspected_at,sites(name),checklist_templates(name),by:profiles!inspector(full_name)")).order("inspected_at", {ascending:false}).limit(20))
  ]);
  $("#main").innerHTML = header("📋 Inspections", "Choose a checklist. Any Fail creates a corrective action automatically.") + shield() + `
    ${can("enter") ? `<div class="tiles">${tpls.map(t => `<a class="tile" href="#inspect/${t.id}"><div class="ic">${catIc(t.category)}</div><b>${esc(t.name)}</b><small>${t.items.length} checks</small></a>`).join("")}</div>` : ""}
    <div class="sec">🗂️ Recent inspections</div>
    <div class="list">${recent.map(r => `<div class="item ${r.score >= 90 ? "lo" : r.score >= 70 ? "md" : "hi"}">
      <div class="row"><b>${esc(r.checklist_templates?.name || "")}</b><span class="chip ${r.score >= 90 ? "ok" : r.score >= 70 ? "warn" : "bad"}">${r.score ?? "–"}%</span></div>
      <div class="small muted" style="margin-top:6px">📍 ${esc(r.sites?.name || "")} · 📅 ${ft(r.inspected_at)} · 👤 ${esc(r.by?.full_name || "")} · ❌ ${r.fails} fail(s)</div>
    </div>`).join("") || empty("📭", "No inspections yet")}</div>`;
};

  const t = await run(sb.from("checklist_templates").select("*").eq("id", id).single());
  S.tpl = t;
  const crit = t.items.filter(i => i.critical).length;
  $("#main").innerHTML = header(`${catIc(t.category)} ${esc(t.name)}`, `${t.items.length} checks · ${crit} critical`) + `
  <form id="fIns">
    <div class="card">
      <label>📍 Area</label>${siteField()}
      <label>👷 Inspected by</label><input value="${esc(S.profile.full_name || "")}" disabled>
    </div>
    <div class="sec">Checklist <span class="muted small" id="prog">0 of ${t.items.length} checked</span></div>
    ${t.items.map(it => `
      <div class="check-row" data-item="${esc(it.id)}">
        <div class="row"><b>${esc(it.text)}</b>${it.critical ? '<span class="chip bad">CRITICAL</span>' : ""}</div>
        <div class="pf">

};
function updProg(){
  const f = $("#fIns"); if (!f) return;
  const done = f.querySelectorAll("[data-item][data-s]").length;
  const total = f.querySelectorAll("[data-item]").length;
  $("#prog").textContent = `${done} of ${total} checked`;
}

/* ===================== ACTIONS ===================== */
PAGES.actions = async (f = "open") => {
  const rows = await run(sf(sb.from("actions").select("*, sites(name)")).order("due_date", {ascending:true, nullsFirst:false}).limit(400));
  const t = localISO();
  const isOpen = r => r.status !== "Closed";
  const list = rows.filter(r => f === "all" ? true : f === "closed" ? r.status === "Closed" : f === "overdue" ? (isOpen(r) && r.due_date && r.due_date < t) : isOpen(r));
  const tab = (k, lbl) => `<a class="${f === k ? "on" : ""}" href="#actions/${k}">${lbl}</a>`;
  $("#main").innerHTML = header("✅ Actions", "Corrective actions from incidents, near misses and inspections") + `
    <div class="seg" style="margin-bottom:14px">${tab("open","🟡 Open")}${tab("overdue","⛔ Overdue")}${tab("closed","✅ Closed")}${tab("all","📋 All")}</div>
    <div class="list">${list.map(r => {
      const od = isOpen(r) && r.due_date && r.due_date < t;
      const pc = r.priority === "High" ? "hi" : r.priority === "Medium" ? "md" : "lo";
      const pchip = r.priority === "High" ? "bad" : r.priority === "Medium" ? "warn" : "ok";
      return `<div class="item ${pc}">
        <div class="row"><b>${esc(r.description)}</b><span class="chip ${pchip}">${esc(r.priority)}</span></div>
        <div class="small muted" style="margin-top:6px">📍 ${esc(r.sites?.name || "")} · 👤 ${esc(r.owner || "Unassigned")} · 📅 ${fd(r.due_date)} ${od ? '<span class="chip bad">OVERDUE</span>' : ""}</div>
        <div class="row" style="margin-top:10px">
          <span class="chip">${r.status === "Closed" ? "✅ Closed" : r.status === "In progress" ? "🔧 In progress" : "🟡 Open"}</span>
          ${can("enter") && isOpen(r) ? `<span style="display:flex;gap:8px">
            ${r.status === "Open" ? `<button class="btn ghost sm" data-act="act_status" data-id="${r.id}" data-s="In progress">🔧 Start</button>` : ""}
            <button class="btn ok sm" data-act="act_status" data-id="${r.id}" data-s="Closed">✅ Close</button></span>` : ""}
        </div></div>`;
    }).join("") || empty("🎉", "Nothing here. Well done.")}</div>`;
};

/* ===================== REPORTS ===================== */
PAGES.reports = async (tab = "kpi") => {
  const tabs = [["kpi","📈 KPIs"],["incidents","🚨 Incidents"],["inspections","✅ Inspections"],["training","🎓 Training & certs"]];
  const seg = `<div class="seg" style="margin-bottom:14px">${tabs.map(([k,l]) => `<a class="${k === tab ? "on" : ""}" href="#reports/${k}">${l}</a>`).join("")}</div>`;
  let body = "";
  if (tab === "incidents") body = await reportIncidents();
  else if (tab === "inspections") body = await reportInspections();
  else if (tab === "training") body = await reportTraining();
  else body = await reportKpi();
  $("#main").innerHTML = header("📊 Reports", "Live from the database. Anyone can export their view to Excel (CSV).") + shield() + seg + body;
};
async function reportKpi(){
  const since = localISO(new Date(Date.now() - 365*864e5)).slice(0,7) + "-01";
  const rows = await run(sf(sb.from("v_monthly_kpi").select("*")).gte("period", since).order("period", {ascending:false}));
  const byM = {};
  rows.forEach(r => {
    const m = r.period;
    byM[m] = byM[m] || {period:m, hours:0, recordable:0, lti:0, near_miss:0};
    byM[m].hours += +r.hours; byM[m].recordable += +r.recordable; byM[m].lti += +r.lti; byM[m].near_miss += +r.near_miss;
  });
  const list = Object.values(byM).sort((a,b) => a.period < b.period ? 1 : -1).map(m => ({
    ...m,
    ltifr: m.hours ? +(m.lti * 1e6 / m.hours).toFixed(2) : 0,
    trir: m.hours ? +(m.recordable * 2e5 / m.hours).toFixed(2) : 0
  }));
  S.last = {name: "kpi", rows: list, cols: [["Month","period"],["Manhours","hours"],["Recordable","recordable"],["LTI","lti"],["Near miss","near_miss"],["LTIFR","ltifr"],["TRIR","trir"]]};
  const t = agg(list);
  const maxL = Math.max(1, ...list.map(m => m.ltifr));
  return `
    <div class="kpis">${kpi("⏱️", fmtN(t.hours), "Manhours (12 months)")}${kpi("🩹", t.recordable, "Recordable injuries")}${kpi("⛔", t.lti, "Lost-time injuries")}${kpi("📉", t.ltifr.toFixed(2), "LTIFR (12 months)")}</div>
    <div class="card" style="margin-top:14px">
      <div class="row"><h2>📉 LTIFR by month</h2>${exportBtn()}</div>
      ${list.length ? list.map(m => `<div class="row small" style="margin:10px 0">
        <span style="width:70px">${m.period.slice(0,7)}</span>
        <div class="bar ${m.ltifr > 0 ? "bad" : ""}" style="flex:1"><i style="width:${Math.round(m.ltifr / maxL * 100)}%"></i></div>
        <b style="width:60px;text-align:right">${m.ltifr}</b></div>`).join("") : empty("📭", "No data yet. Enter manhours and incidents first.")}
    </div>
    <div class="card" style="margin-top:14px"><div class="scroll"><table>
      <tr><th>Month</th><th>Manhours</th><th>Rec.</th><th>LTI</th><th>Near miss</th><th>LTIFR</th><th>TRIR</th></tr>
      ${list.map(m => `<tr><td>${m.period.slice(0,7)}</td><td>${fmtN(m.hours)}</td><td>${m.recordable}</td><td>${m.lti}</td><td>${m.near_miss}</td><td>${m.ltifr}</td><td>${m.trir}</td></tr>`).join("")}
    </table></div></div>`;
}
async function reportIncidents(){
  const r = S.range || {from: addDays(-90), to: localISO()};
  const rows = await run(sf(sb.from("incidents").select("*, sites(name), reporter:profiles!reported_by(full_name)"))
    .gte("occurred_at", r.from).lte("occurred_at", r.to + "T23:59:59").order("occurred_at", {ascending:false}).limit(500));
  const label = e => ENTRY_TYPES.find(t => t.id === e)?.t || e;
  S.last = {name: "incidents", rows, cols: [
    ["Date", x => ft(x.occurred_at)], ["Type", x => label(x.event_type)], ["Class", x => x.classification || ""],
    ["Area", "area"], ["Site", x => x.sites?.name || ""], ["Severity", "severity"], ["Likelihood", "likelihood"],
    ["Description", "description"], ["Entered by", x => x.reporter?.full_name || ""]
  ]};
  const c = {inc: rows.filter(x => x.event_type === "incident").length, nm: rows.filter(x => x.event_type === "near_miss").length, uc: rows.filter(x => x.event_type === "unsafe_condition").length};
  return `
    <div class="card"><form id="fRange" class="grid" style="grid-template-columns:1fr 1fr auto;gap:10px;align-items:end">
      <div><label>📅 From</label><input type="date" name="fromD" value="${r.from}"></div>
      <div><label>📅 To</label><input type="date" name="toD" value="${r.to}"></div>
      <button class="btn sm" style="margin-bottom:2px">🔍 Apply</button>
    </form></div>
    <div class="kpis" style="margin-top:14px">${kpi("🚨", c.inc, "Incidents")}${kpi("🟡", c.nm, "Near misses")}${kpi("⚠️", c.uc, "Unsafe conditions")}${kpi("🧾", rows.length, "Total entries")}</div>
    <div class="card" style="margin-top:14px"><div class="row" style="margin-bottom:8px"><h2>🚨 Register</h2>${exportBtn()}</div>
    <div class="scroll"><table><tr><th>Date</th><th>Type</th><th>Area</th><th>Site</th><th>Sev × Lik</th><th>Description</th><th>Entered by</th></tr>
    ${rows.map(x => `<tr><td>${ft(x.occurred_at)}</td><td>${ENTRY_TYPES.find(t => t.id === x.event_type)?.ic || ""} ${label(x.event_type)}${x.classification ? `<br><span class="muted">${CLASS_ICON(x.classification)} ${esc(x.classification)}</span>` : ""}</td><td>${esc(x.area || "")}</td><td>${esc(x.sites?.name || "")}</td><td>${(x.severity||0) * (x.likelihood||0)}</td><td>${esc(x.description).slice(0,90)}</td><td>${esc(x.reporter?.full_name || "")}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">No entries in this date range</td></tr>`}
    </table></div></div>`;
}
async function reportInspections(){
  const rows = await run(sf(sb.from("inspections").select("*, sites(name), checklist_templates(name), by:profiles!inspector(full_name)")).order("inspected_at", {ascending:false}).limit(300));
  S.last = {name: "inspections", rows, cols: [
    ["Date", x => ft(x.inspected_at)], ["Site", x => x.sites?.name || ""], ["Checklist", x => x.checklist_templates?.name || ""],
    ["Score %", "score"], ["Fails", "fails"], ["Inspected by", x => x.by?.full_name || ""]
  ]};
  return `<div class="card"><div class="row" style="margin-bottom:8px"><h2>✅ Inspection register</h2>${exportBtn()}</div>
    <div class="scroll"><table><tr><th>Date</th><th>Site</th><th>Checklist</th><th>Score</th><th>Fails</th><th>Inspected by</th></tr>

/* ===================== ACTIONS (buttons) ===================== */
const ACTS = {
  pf: (b) => {
    const row = b.closest("[data-item]");
    const s = b.dataset.s;
    row.dataset.s = s;
    row.querySelectorAll(".pf button").forEach(x => x.classList.toggle("on", x === b));
    row.querySelector(".note").classList.toggle("hidden", s !== "fail");
    updProg();
  },
  act_status: async (b) => {
    const s = b.dataset.s;
    await run(sb.from("actions").update({status: s, closed_at: s === "Closed" ? new Date().toISOString() : null}).eq("id", b.dataset.id));
    audit("update", "actions", b.dataset.id);
    toast("✅ Updated");
    route();
  },
  decide: async (b) => {
    const d = +b.dataset.days;
    const patch = d === 0 ? {status: "rejected"} : {status: "approved", expires_at: new Date(Date.now() + d*864e5).toISOString()};
    await run(sb.from("access_requests").update({...patch, decided_by: S.user.id, decided_at: new Date().toISOString()}).eq("id", b.dataset.id));
    audit("decide", "access_requests", b.dataset.id);
    toast(d ? "✅ Approved for " + d + " days" : "❌ Rejected");
    route();
  },
  ack: async (b) => {
    await run(sb.from("document_acks").upsert({document_id: b.dataset.id, user_id: S.user.id}));
    toast("✍️ Acknowledged");
    route();
  },
  open_doc: async (b) => {
    const w = window.open("", "_blank");
    const {data, error} = await sb.storage.from(CONFIG.bucket).createSignedUrl(b.dataset.path, 300);
    if (error) { if (w) w.close(); throw error; }
    if (w) w.location = data.signedUrl; else window.open(data.signedUrl, "_blank");
    audit("view", "documents", b.dataset.path);
  },
  save_user: async (b) => {
    const row = b.closest("[data-user]");
    const id = b.dataset.id;
    await run(sb.from("profiles").update({
      full_name: row.querySelector("[name=name]").value.trim() || null,
      role: row.querySelector("[name=role]").value,
      site_id: row.querySelector("[name=site_id]").value || null
    }).eq("id", id));
    audit("update", "profiles", id);
    toast("💾 Saved");
    if (id === S.user.id) { await loadProfile(); buildNav(); }
  },
  export: () => { if (!S.last) return toast("Nothing to export"); exportCSV(S.last.name, S.last.rows, S.last.cols); },
  signout: async () => { await sb.auth.signOut(); S.user = null; S.profile = null; location.hash = ""; showLogin(); }
};
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  e.preventDefault();
  try { await ACTS[b.dataset.act](b); } catch (x) { err(x); }
});

/* ===================== FORMS ===================== */
const FORMS = {
  fInc: async (f) => {
    const d = fdata(f);
    const kind = f.dataset.kind;
    const row = {
      site_id: d.site_id, event_type: kind,
      classification: kind === "incident" ? d.classification.replace(/^\S+\s/, "") : null,
      occurred_at: new Date(d.occurred_at).toISOString(),
      area: d.area, severity: +d.severity, likelihood: +d.likelihood,
      description: d.description, root_cause: d.root_cause || null
    };
    const inc = await run(sb.from("incidents").insert(row).select("id").single());
    if (d.ac_desc) {
      await run(sb.from("actions").insert({site_id: d.site_id, description: d.ac_desc, owner: d.ac_owner || null,
        due_date: d.ac_due || addDays(14), priority: d.ac_priority || "Medium", source_incident_id: inc.id}));
    }
    audit("create", "incidents", inc.id);
    toast("✅ Report saved");
    location.hash = "#home";
  },
  fMan: async (f) => {
    const d = fdata(f);
    await run(sb.from("manhours").upsert({site_id: d.site_id, period: d.month + "-01", hours: +d.hours}, {onConflict: "site_id,period"}));
    audit("upsert", "manhours", d.site_id);
    toast("✅ Manhours saved");
    location.hash = "#home";
  },
  fTrn: async (f) => {
    const d = fdata(f);
    await run(sb.from("training").insert({site_id: d.site_id, person_name: d.person_name, competency: d.competency,
      provider: d.provider || null, issued: d.issued || null, expiry: d.expiry || null}));
    toast("✅ Training saved");
    location.hash = "#training";
  },
  fCert: async (f) => {
    const d = fdata(f);
    await run(sb.from("certificates").insert({site_id: d.site_id, name: d.name, category: d.category, stage: d.stage,
      agency: d.agency || null, expiry: d.expiry || null, notes: d.notes || null}));
    toast("✅ Certificate saved");
    location.hash = "#training";
  },
  fAct: async (f) => {
    const d = fdata(f);
    await run(sb.from("actions").insert({site_id: d.site_id, description: d.description, owner: d.owner || null,
      due_date: d.due_date, priority: d.priority}));
    toast("✅ Action saved");
    location.hash = "#actions";
  },
  fIns: async (f) => {
    const tpl = S.tpl;
    const site_id = f.elements["site_id"].value;
    const answers = {};
    const missing = [];
    let pass = 0, fail = 0;
    tpl.items.forEach(it => {
      const row = f.querySelector(`[data-item="${CSS.escape(it.id)}"]`);
      const s = row.dataset.s;
      const note = row.querySelector(".note").value.trim();
      if (!s) { missing.push(it); return; }
      answers[it.id] = {status: s, note};
      if (s === "pass") pass++;
      if (s === "fail") fail++;
    });
    if (missing.length) return toast(`Answer every check (${missing.length} left)`);
    const noNote = tpl.items.filter(it => answers[it.id].status === "fail" && !answers[it.id].note);
    if (noNote.length) return toast("Write a note for every Fail");
    const score = pass + fail ? Math.round(pass * 100 / (pass + fail)) : 100;
    const ins = await run(sb.from("inspections").insert({site_id, template_id: tpl.id, answers, score, fails: fail}).select("id").single());
    const acts = tpl.items.filter(it => answers[it.id].status === "fail").map(it => ({
      site_id, description: `[${tpl.name}] ${it.text} — ${answers[it.id].note}`,
      due_date: addDays(it.critical ? 3 : 7), priority: it.critical ? "High" : "Medium", source_inspection_id: ins.id
    }));
    if (acts.length) await run(sb.from("actions").insert(acts));
    audit("create", "inspections", ins.id);
    toast(`✅ Saved · score ${score}% · ${acts.length} action(s) created`);
    location.hash = "#inspections";
  },
  fDoc: async (f) => {
    const d = fdata(f);
    const file = f.elements.file.files[0];
    if (!file) throw new Error("Choose a file first");
    const path = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;
    const up = await sb.storage.from(CONFIG.bucket).upload(path, file, {upsert: false, contentType: file.type || "application/octet-stream"});
    if (up.error) throw up.error;
    try {
      await run(sb.from("documents").insert({title: d.title, doc_no: d.doc_no || null, version: d.version || "1.0",
        category: d.category, status: d.status, site_id: d.site_id || null, file_name: file.name, storage_path: path,
        review_due: d.review_due || null, restricted: !!d.restricted}));
    } catch (e) {
      await sb.storage.from(CONFIG.bucket).remove([path]);
      throw e;
    }
    audit("create", "documents", path);
    toast("✅ Uploaded");
    location.hash = "#docs";
  },
  fAcc: async (f) => {
    const d = fdata(f);
    await run(sb.from("access_requests").insert({site_id: d.site_id, reason: d.reason}));
    toast("📨 Request sent to your manager");
    location.hash = "#access";
  },
  fSite: async (f) => {
    const d = fdata(f);
    await run(sb.from("sites").insert({name: d.name, location: d.location || null}));
    await loadSites();
    toast("✅ Area added");
    buildNav();
    route();
  },
  fRange: async (f) => {
    S.range = {from: f.elements.fromD.value, to: f.elements.toD.value};
    route();
  }
};
document.addEventListener("submit", async (e) => {
  const H = FORMS[e.target.id];
  if (!H) return;

  const btn = e.target.querySelector("button");
  if (btn) btn.disabled = true;
  try { await H(e.target); }
  catch (x) { err(x); }
  finally { if (btn) btn.disabled = false; }
});
