# Keeps the free Supabase project awake (free projects pause after about 7 days idle).
# Runs every 3 days. Reads only one row from the public "sites" table.
name: keep-supabase-awake

on:
  schedule:
    - cron: "17 3 */3 * *"   # every 3 days, 03:17 UTC (08:47 India)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://caygfknyxprkycyzbnhi.supabase.co/rest/v1/sites?select=id&limit=1" \
            -H "apikey: sb_publishable_s2s8S_cALkToUQdWBtCKyg_L9JOvMpp" \
            -H "Authorization: Bearer sb_publishable_s2s8S_cALkToUQdWBtCKyg_L9JOvMpp")
          echo "Supabase responded with HTTP $code"
          # 200 = awake and working. Anything else fails the run so you get an alert.
          test "$code" = "200"
